<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實驗室成員介紹</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 250px;
      margin: 15px;
      padding: 20px;
      text-align: center;
    }
    .card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0 5px 0;
    }
    .card p {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>我們的實驗室成員</h1>
    <p>Lab Members</p>
  </header>

  <div class="container">
    <!-- 成員樣板 -->
    <div class="card">
      <img src="https://via.placeholder.com/100" alt="頭像">
      <h3>姓名</h3>
      <p>職稱</p>
      <p>研究方向或簡介</p>
      <p>Email@example.com</p>
    </div>
  </div>
</body>
</html>
